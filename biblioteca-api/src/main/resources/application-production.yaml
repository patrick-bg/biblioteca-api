spring:
  application:
    name: biblioteca-api
  datasource:
    url: jdbc:postgresql://localhost:5435/biblioteca
    driver-class-name: org.postgresql.Driver
    username: biblioteca
    password: biblioteca123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: 3600