<header class="header">
    <h1>Cadastro de Autores</h1>

    <div class="user-area">
        <span class="user-name">Olá, Usuário</span>
        <i class="fa-solid fa-circle-user"></i>
    </div>
</header>

<main class="content">
    <div class="card">
        <h2>Novo Autor</h2>

        <form class="form">
            <div class="form-group">
                <label for="nome">Nome do Autor: *</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: NomeAutor" />
            </div>

            <div class="form-group">
                <label for="dataNascimento">Data Nascimento: *</label>
                <input type="date" id="dataNascimento" name="dataNascimento" >
            </div>

            <div class="form-group">
                <label for="generoAutor">Genero do Autor(a): *</label>
                <select>
                    <option value="">Selecione...</option>
                    <option value="MASCULINO">Masculino</option>
                    <option value="FEMININO">Feminino</option>
                    <option value="NEUTRO">Neutro</option>                    
                </select>
            </div>

            <div class="form-group">
                <label for="paisOrigem">País de Origem: *</label>
                <input type="text" id="paisOrigem" name="paisOrigem" placeholder="Ex: Brasil" />
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Salvar</button>
                <button type="button" class="btn-secondary">Cancelar</button>
            </div>

        </form>
    </div>

</main>
